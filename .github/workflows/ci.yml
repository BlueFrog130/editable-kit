name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      # Build first: the examples resolve @editable-kit/svelte through its exports map,
      # so `check` cannot see it until dist exists. Packages only — building the
      # Cloudflare example needs its ADMIN_TOKEN, which CI has no business holding.
      - run: pnpm build:packages
      - run: pnpm check
      - run: pnpm test
